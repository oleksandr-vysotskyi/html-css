<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Burgers</title>
</head>
<body>
<header class="bowlby-font">
    <div class="container">
        <nav>
            <ul>
                <li>
                    <a href="#" title="About">About</a>
                </li>
                <li>
                    <a href="#" title="Menu">Menu</a>
                </li>
            </ul>
            <a href="#" title="Order Online" class="order">Order Online</a>
        </nav>
    </div>

<main>
    <section class="burgers">
        <div class="container">
            <h1 class="bowlby-font">NEW YORK’S FAVORITE ORGANIC HAMBURGER JOINT</h1>
            <img src="./img/burgers.png" alt="burgers" width="700" height="396">
            <article>
                <h3 class="bowlby-font">the burger above all burgers</h3>
                <div class="about">
                    <p class="inter-font">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean nec ornare neque.</p>
                    <a href="#" title="About Us" class="bowlby-font">About Us</a>
                </div>
            </article>
        </div>
    </section>
    <section class="dishes">
        <div class="container">
            <img src="./img/fries.png" alt="Fries">
            <img src="./img/burger.png" alt="Burger Dish">
        </div>
    </section>
    <section class="establishment bowlby-font">
        <div class="container">
            <img src="./img/establishment.png" alt="establishment">
            <p>order online or come visit us today</p>
            <a href="#" title="Get Started">Get Started</a>
        </div>
    </section>
