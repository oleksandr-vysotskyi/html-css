<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Instagram Form</title>
</head>
<body>
<div class="container">
    <form action="">
        <img src="./img/instagram.svg" alt="instagram" width="200" height="75">
        <div class="login">
            <input type="email" name="email" placeholder="Номер телефону, ім'я користувача або email" required autocomplete="email">
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Увійти</button>
            <p>Або</p>
            <a href="#" title="Увійти через Facebook">Увійти через Facebook</a>
            <a href="#" title="">Забули пароль?</a>
        </div>
    </form>
    <div class="registration">
        <p>Не маєте облікового запису?</p>
        <a href="#" title="Зареєструйся">Зареєструйтеся</a>
    </div>
</div>
</body>
</html>
